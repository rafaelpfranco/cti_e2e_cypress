name: Cypress E2E

on:
  workflow_dispatch:
    inputs:
      tipo_teste:
        description: Tipo de teste a executar
        required: true
        default: regressivo
        type: choice
        options:
          - todos
          - regressivo
          - complementar

jobs:
  e2e:
    name: Executar Cypress E2E
    runs-on: ubuntu-latest

    env:
      BASE_URL: ${{ secrets.BASE_URL }}
      USER_EMAIL: ${{ secrets.USER_EMAIL }}
      USER_PASSWORD: ${{ secrets.USER_PASSWORD }}
      TIPO_TESTE: ${{ github.event.inputs.tipo_teste || 'regressivo' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Validate TypeScript
        run: npx tsc --noEmit

      - name: Run all tests
        if: ${{ github.event.inputs.tipo_teste == 'todos' }}
        run: npm run cy:run

      - name: Run regression tests
        if: ${{ github.event.inputs.tipo_teste == 'regressivo' }}
        run: npm run cy:run:regressivo

      - name: Run complementary tests
        if: ${{ github.event.inputs.tipo_teste == 'complementar' }}
        run: npm run cy:run:complementar

      - name: Upload Cypress screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: cypress/screenshots
          if-no-files-found: ignore

      - name: Upload Cypress videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-videos
          path: cypress/videos
          if-no-files-found: ignore

      - name: Upload Cypress reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-reports
          path: cypress/reports
          if-no-files-found: ignore

      - name: Upload Cypress downloads
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-downloads
          path: cypress/downloads
          if-no-files-found: ignore
